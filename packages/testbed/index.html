<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sugata 姿 — testbed</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0b0b0d;
            color: #e6e6e6;
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            overscroll-behavior: none;
        }

        /* CSS owns canvas layout; Stage only sizes the drawing buffer to match. */
        #stage {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            white-space: pre;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div id="hud">booting…</div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
