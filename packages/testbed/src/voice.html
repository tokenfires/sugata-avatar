<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>姿 — voice</title>
<style>
    :root { color-scheme: dark; }

    html, body {
        margin: 0;
        height: 100%;
        background: #08080a;
        color: #d8dae0;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
    }

    #stage { display: block; width: 100vw; height: 100vh; }

    #hud, #controls {
        position: fixed;
        padding: 10px 12px;
        background: rgba( 8, 8, 12, 0.72 );
        border: 1px solid rgba( 255, 255, 255, 0.10 );
        border-radius: 6px;
        white-space: pre;
    }

    #hud { top: 12px; left: 12px; max-width: 48vw; }
    #controls { top: 12px; right: 12px; white-space: normal; width: 280px; }

    #controls label { display: block; margin: 8px 0 2px; opacity: 0.75; }
    #controls input[ type="range" ] { width: 100%; }
    #controls button {
        font: inherit;
        color: inherit;
        background: rgba( 255, 255, 255, 0.08 );
        border: 1px solid rgba( 255, 255, 255, 0.18 );
        border-radius: 4px;
        padding: 5px 9px;
        margin: 4px 4px 0 0;
        cursor: pointer;
    }
    #controls button:hover { background: rgba( 255, 255, 255, 0.16 ); }
    #controls .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

    #meter {
        position: fixed;
        left: 12px;
        bottom: 12px;
        right: 12px;
        height: 74px;
        /* ?w/?h letterboxing makes the body a centred grid, and `place-items: center` applies
           self-alignment to fixed boxes too — which shrink-wraps this strip into the corner
           however wide its left/right offsets say it is. Opt back out explicitly. */
        place-self: end stretch;
        background: rgba( 8, 8, 12, 0.72 );
        border: 1px solid rgba( 255, 255, 255, 0.10 );
        border-radius: 6px;
    }

    #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        letter-spacing: 0.1em;
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="boot">booting…</div>

<div id="hud"></div>

<div id="controls">
    <div class="row">
        <button id="play">speak</button>
        <button id="stop">stop</button>
        <button id="audio">start audio clock</button>
    </div>

    <label>rate <span id="rateValue">1.00</span>x</label>
    <input id="rate" type="range" min="0.4" max="2.2" step="0.05" value="1">

    <label>lead <span id="leadValue">40</span> ms</label>
    <input id="lead" type="range" min="0" max="125" step="5" value="40">

    <label>hold one viseme</label>
    <div class="row" id="poses"></div>
</div>

<canvas id="meter"></canvas>

<script type="module" src="./voice.js"></script>
</body>
</html>
