<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember · likeness study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeece6;color:#30352f;font:16px/1.5 system-ui,sans-serif}header{padding:24px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9d6cc}h1{font:500 26px Georgia,serif;margin:0}header p{margin:3px 0 0;color:#676c63;font-size:14px}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;padding:24px 32px}#stage{min-height:640px;height:calc(100vh - 205px);position:relative;background:#b9beb5;border-radius:10px;overflow:hidden}canvas{width:100%;height:100%;display:block}#status{position:absolute;left:22px;bottom:16px;max-width:85%;font-size:13px;padding:7px 12px;background:#eeece6e8;border-radius:6px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}button{font:inherit;font-size:13px;border:1px solid #c0c4b8;border-radius:20px;background:transparent;color:inherit;padding:7px 14px;cursor:pointer}button[aria-pressed=true]{background:#364a3e;color:#fff;border-color:#364a3e}button:focus-visible{outline:3px solid #b25c33;outline-offset:3px}aside h2{font-size:15px;margin:0 0 12px}figure{margin:0 0 20px}figure img{width:100%;display:block;border-radius:8px}figcaption{font-size:12px;color:#686d64;margin-top:5px}aside p{font-size:13px;color:#686d64}#version{font-size:13px;padding:6px 12px;border:1px solid #d0d2c6;border-radius:18px}footer{padding:0 32px 20px;font-size:12px;color:#696f64}@media(max-width:800px){main{display:block;padding:16px}header{padding:18px}#stage{height:70vh;min-height:420px}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}aside h2,aside p{grid-column:1/-1}footer{padding:0 16px 20px}}
</style>
<header><div><h1>Ember Hearth</h1><p>A first look at her face</p></div><span id="version">Facial study 001</span></header>
<main><section aria-label="Rendered character">
<nav aria-label="View"><button data-view="front" aria-pressed="true">Front</button><button data-view="angle" aria-pressed="false">Three-quarter</button><button data-light="warm" aria-pressed="true">Warm light</button><button data-light="neutral" aria-pressed="false">Neutral light</button><button id="freckles" aria-pressed="true">Freckles</button></nav>
<div id="stage"><canvas id="portrait" aria-label="Ember's rendered facial candidate"></canvas><div id="status" role="status">Loading her facial study…</div></div>
