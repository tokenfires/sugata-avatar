<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mara · original midi skirt review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #302a30; background: #e8e3df; font: 14px/1.4 system-ui,sans-serif; }
  header { height: 70px; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  p { margin: 2px 0; }
  button { padding: 8px 14px; font: inherit; border: 1px solid #706570; border-radius: 5px; background: #f7f4f2; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #6b487c; outline-offset: 3px; }
  #views { display: block; width: 100%; height: 560px; }
  #labels { display: grid; grid-template-columns: repeat(3,1fr); text-align: center; height: 24px; font-weight: 600; }
  footer { padding: 4px 20px; }
  #status { margin: 0; min-height: 20px; }
  details { margin-top: 6px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
</style>
<header><div><h1>Mara · midi skirt</h1><p>Original editable artist draft · unitless · body fit and motion unqualified</p></div><button id="finish" type="button">Finish review</button></header>
<main><canvas id="views" aria-label="Original midi skirt: front, right profile and rear"></canvas><div id="labels"><span>Front</span><span>Right profile</span><span>Rear</span></div></main>
<footer><p id="status" role="status" aria-live="polite">Preparing the original three views…</p><details><summary>Review record</summary><pre id="record"></pre></details></footer>
<script type="module" src="./preview.mjs"></script>
</html>
