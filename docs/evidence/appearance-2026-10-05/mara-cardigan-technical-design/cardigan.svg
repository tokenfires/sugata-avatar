<svg id="sheet" xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="sheet-title sheet-description">
  <title id="sheet-title">Mara: original long open cardigan technical design</title>
  <desc id="sheet-description">Complete front, authored right profile and rear, and a smaller authored inside schematic. Long bands, two front patch pockets, full cuffs and lower rib hem. Original unitless art; sewing, 3D, fit and motion are unqualified.</desc>
