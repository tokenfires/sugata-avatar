      text{font-family:Arial,Helvetica,sans-serif;fill:#493728}
      .title{font-size:30px;font-weight:700}.label{font-size:20px;font-weight:700}
      .note{font-size:15px;fill:#47564d}.small{font-size:13px;fill:#47564d}
      .body{fill:#b8885c;stroke:#493728;stroke-width:2;stroke-linejoin:round}
      .band{fill:#9b683f;stroke:#493728;stroke-width:1.5;stroke-linejoin:round}
      .rib{fill:#a7774c;stroke:#493728;stroke-width:1.5;stroke-linejoin:round}
      .pocket{fill:#bf9168;stroke:#493728;stroke-width:1.5;stroke-linejoin:round}
      .attach{fill:none;stroke:#493728;stroke-width:1.2;stroke-dasharray:4 3;stroke-linecap:round}
      .edge{fill:none;stroke:#493728;stroke-width:2;stroke-linecap:round}
      .leader{fill:none;stroke:#7d6956;stroke-width:1}
      .inside-body{fill:#e5d6c4;stroke:#493728;stroke-width:2;stroke-linejoin:round}
      .inside-band{fill:#c59a73;stroke:#493728;stroke-width:1.5;stroke-linejoin:round}
    </style>
