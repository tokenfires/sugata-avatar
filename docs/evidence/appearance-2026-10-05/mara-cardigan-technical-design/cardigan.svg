  <text id="front-note-1" x="100" y="685" class="note">Open front · two low patch pockets</text>
  <text id="front-note-2" x="100" y="709" class="small">Top open; dashed U attaches sides + bottom.</text>
  <text id="profile-note-1" x="478" y="685" class="note">Full sleeve · hem below cuff</text>
  <text id="profile-note-2" x="478" y="709" class="small">Near P-R partly hidden; far P-L hidden.</text>
  <text id="rear-note-1" x="885" y="685" class="note">Quiet long back · no rear pockets</text>
  <text id="rear-note-2" x="885" y="709" class="small">Nape band belongs to continuous B.</text>
  <path id="lower-rule" d="M48 734H1232" stroke="#d9cabb" fill="none"/>
  <text id="key-title" x="48" y="771" class="label">Design responsibilities</text>
  <text id="key-band" x="48" y="802" class="note">B / one continuous front + nape band; inward side explicitly authored</text>
  <text id="key-pockets" x="48" y="828" class="note">P-R + P-L / exactly two front pockets; inside shows attachment traces only</text>
  <text id="key-cuffs" x="48" y="854" class="note">C-R + C-L / full rib cuffs, open wrist intent · H / continuous body hem</text>
  <text id="key-ribs" x="48" y="880" class="small">Parallel marks mean rib intent; dashed marks mean proposed attachment or inside edge.</text>
  <text id="key-scope" x="48" y="910" class="small">Technical sketches, not registered views or a sewing pattern. No gauge, dimensions, 3D, fit or motion proof.</text>
  <text id="key-editability" x="48" y="934" class="small">Named SVG groups + complete JSON mark registry · all coordinates, hidden roles and display colours are original.</text>
  <text id="inside-label" x="900" y="768" class="label">04 / Inside facing</text>
