<svg xmlns="http://www.w3.org/2000/svg" id="interior-sheet" width="1280" height="1260" viewBox="0 0 1280 1260" role="img" aria-labelledby="title description">
<title id="title">Ari: inside the short bomber</title>
<desc id="description">Original unitless front and back interior studies with full sleeve lining, neck and front facings, hidden outer-pocket bags, separate zipper halves and retained open neck, hem and wrists. Details explain facing, pocket layers and back fold intent. These independent artist views are not sewing patterns or fitted surfaces.</desc>
