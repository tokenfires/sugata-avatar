<text id="waist-caption-2" x="48" y="1272" class="small">Short upper marks: anchored pleat intent.</text>
<text id="waist-caption-3" x="48" y="1297" class="small">Lower line: crease, not another sewn pleat.</text>
<text id="waist-caption-4" x="48" y="1322" class="small">G-R is behind the overlap and zip intent.</text>

