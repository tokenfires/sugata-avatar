<text id="hem-caption-3" x="878" y="1322" class="small">No shoe fit, floor contact or fold solution.</text>

<path id="footer-rule" d="M48 1364H1232" stroke="#d1cabd"/>
<text id="line-key" x="48" y="1394" class="small">Solid: visible edge/fold · short dashed: stitch/closure intent · long dashed: hidden bag/guard · circle: pleat release</text>
<text id="diagram-key" x="48" y="1420" class="small">Enlarged light fills are layer diagrams, not colour changes. Named joins and side transitions are editing relationships only.</text>
<text id="overlap-intent" x="48" y="1446" class="small">T / Worn intent: slate tee covers the waist beneath the short rust jacket; the retained character below remains unchanged.</text>
<text id="scope-limit" x="48" y="1475" class="small">Unitless original art. Physical seams, stretch, access, material behavior, 3D body fit, pose/motion and runtime remain open.</text>
