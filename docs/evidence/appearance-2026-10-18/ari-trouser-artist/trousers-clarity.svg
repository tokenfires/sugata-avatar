<svg xmlns="http://www.w3.org/2000/svg" id="trouser-sheet" width="1280" height="1510" viewBox="0 0 1280 1510" role="img" aria-labelledby="title description">
<title id="title">Ari: a calm front, room to fall</title>
<desc id="description">Original unitless ink-trouser artist studies: front, right profile and rear, with flat front waistband, gathered back, outward front pleats, fly overlap and guard, separate angled pockets, plain hems and fictional shoe guides. Independent views and editing relationships, not sewing patterns, registered surfaces or body fit.</desc>
