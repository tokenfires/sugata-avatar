  <rect x="712" y="134" width="848" height="298" rx="12" class="panel"/>
  <rect x="712" y="454" width="394" height="484" rx="12" class="panel"/>
  <rect x="1128" y="454" width="432" height="484" rx="12" class="panel"/>
  <text x="64" y="177" class="heading">THE GARMENT</text>
  <text x="64" y="207" class="small">Same exterior intent; details enlarged at right.</text>
