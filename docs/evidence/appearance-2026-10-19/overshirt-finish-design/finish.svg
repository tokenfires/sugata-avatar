    <circle cx="994" cy="610" r="7" class="button"/><path class="edge" d="M991 607 L997 613 M997 607 L991 613"/>
    <circle cx="1001" cy="684" r="7" class="button"/><path class="edge" d="M998 681 L1004 687 M1004 681 L998 687"/>
    <circle cx="1008" cy="758" r="7" class="button"/><path class="edge" d="M1005 755 L1011 761 M1011 755 L1005 761"/>
