<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <title>Olive overshirt — finishing intent</title>
  <desc>Original editable fictional artist design: front and back context, upper and underside collar, inside facing return and opened slit cuff with overlap closure. Unitless design, not a pattern or physical construction proof.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#26352f} .title{font-size:38px;font-weight:700} .sub{font-size:21px;fill:#58665c}
    .heading{font-size:25px;font-weight:700} .label{font-size:20px} .small{font-size:18px;fill:#58665c} .micro{font-size:16px;fill:#58665c}
    .panel{fill:#fffdf8;stroke:#d9d9ce;stroke-width:1.5} .outer{fill:#6c765b;stroke:#344634;stroke-width:2.5;stroke-linejoin:round}
    .inside{fill:#d4c7aa;stroke:#5a6450;stroke-width:2} .edge{fill:none;stroke:#344634;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .stitch{fill:none;stroke:#ede4cf;stroke-width:1.6;stroke-dasharray:4 4} .fold{fill:none;stroke:#b17b33;stroke-width:2;stroke-dasharray:8 5}
    .lead{fill:none;stroke:#788675;stroke-width:1.5} .button{fill:#ddd1b8;stroke:#344634;stroke-width:1.6} .hole{fill:none;stroke:#29392b;stroke-width:3;stroke-linecap:round}
    .tag{fill:#263e32} .tagtext{font-size:18px;font-weight:700;fill:#fffdf8;text-anchor:middle}
  </style>
  <rect width="1600" height="1100" fill="#f0f1e9"/>
  <text x="42" y="60" class="title">OLIVE OVERSHIRT / FINISHING INTENT</text>
  <text x="44" y="98" class="sub">Relaxed, open front. Original interior choices for future character and wardrobe authorship.</text>
  <text x="1556" y="99" text-anchor="end" class="small">01 / ARTIST SOURCE</text>
