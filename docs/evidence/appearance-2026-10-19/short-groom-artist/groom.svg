 <title id="title">Short swept groom — original artist turnaround</title>
 <desc id="desc">Independent front, right profile, rear and top drawings choose an open forehead, soft left separation, rightward crest, posterior right clockwise whorl and rounded close nape. Unitless unregistered artist intent, not a fitted scalp or native groom.</desc>
