<svg xmlns="http://www.w3.org/2000/svg" id="sheet" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title description">
<title id="title">Ari: original short bomber technical drawing</title>
<desc id="description">Original unitless front, right profile, rear and inside schematic with separate zipper edges, inward facings, pocket bags and gathered cuffs and hem. Technical art, not a sewing pattern or fitted garment.</desc>
