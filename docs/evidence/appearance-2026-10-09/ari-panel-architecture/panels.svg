<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1580" viewBox="0 0 1360 1580" role="img" aria-labelledby="title desc">
<title id="title">Ari — original five-panel seam architecture</title>
<desc id="desc">Unitless outer and lining diagrams, explicit ten seam pairs per layer and three opening cycles. No metric sewing dimensions, three-dimensional placement or fit qualification.</desc>
<defs><marker id="direction" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7 Z" fill="#313939"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#283333} .heading{font-size:32px;font-weight:700}.section{font-size:24px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.edge{font-size:17px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#faf7f0;stroke-width:5px;stroke-linejoin:round}.panelTitle{font-size:19px;font-weight:700;text-anchor:middle}</style>
<rect width="1360" height="1580" fill="#faf7f0"/>
<text x="40" y="52" class="heading">Ari / five panels, explicit joins</text>
<text x="40" y="88" class="body">Original unitless architecture • not cutting dimensions, sewn fit or a 3D garment</text>
<text x="40" y="121" class="small">S1–S10 pair within each layer; seventeen parameter samples pair i ↔ 16−i. Unequal path lengths are not resolved.</text>
<text x="40" y="164" class="section">01 / Outer shell main panels</text><g id="O.FR" transform="translate(50 215)"><text x="70" y="-18" class="panelTitle">O.FR / Right front</text><path id="O.FR.outline" d="M15,35 L55,15 L125,45 C105,80 110,125 140,140 L120,265 L15,265 L15,35 Z" fill="#c98e6d" stroke="#333d3d" stroke-width="2"/><path id="O.FR.neck" d="M15,35 L55,15" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="35" y="7" class="edge" style="fill:#ad3f36">N</text><path id="O.FR.shoulder" d="M55,15 L125,45" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="90" y="16" class="edge" style="fill:#9d521e">S1</text><path id="O.FR.arm" d="M125,45 C105,80 110,125 140,140" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="110" y="100" class="edge" style="fill:#145c92">S5</text><path id="O.FR.side" d="M140,140 L120,265" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="155" y="205" class="edge" style="fill:#596364">S3</text><path id="O.FR.hem" d="M120,265 L15,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="67" y="288" class="edge" style="fill:#ad3f36">H</text><path id="O.FR.front" d="M15,265 L15,35" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="-7" y="155" class="edge" style="fill:#ad3f36">F</text><path d="M60,205 L90,170" fill="none" stroke="#55534d" stroke-width="2" stroke-dasharray="4 4"/><text x="70" y="230" class="small" text-anchor="middle">pocket mark*</text></g><g id="O.B" transform="translate(275 215)"><text x="120" y="-18" class="panelTitle">O.B / Full back</text><path id="O.B.outline" d="M145,35 C130,48 110,48 95,35 L25,60 C45,90 40,125 10,140 L35,265 L205,265 L230,140 C200,125 195,90 215,60 L145,35 Z" fill="#c98e6d" stroke="#333d3d" stroke-width="2"/><path id="O.B.neck" d="M145,35 C130,48 110,48 95,35" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="120" y="17" class="edge" style="fill:#ad3f36">N</text><path id="O.B.shoulderL" d="M95,35 L25,60" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="59" y="32" class="edge" style="fill:#9d521e">S2</text><path id="O.B.armL" d="M25,60 C45,90 40,125 10,140" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="-7" y="105" class="edge" style="fill:#724994">S8</text><path id="O.B.sideL" d="M10,140 L35,265" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="-7" y="205" class="edge" style="fill:#596364">S4</text><path id="O.B.hem" d="M35,265 L205,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="120" y="288" class="edge" style="fill:#ad3f36">H</text><path id="O.B.sideR" d="M205,265 L230,140" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="247" y="205" class="edge" style="fill:#596364">S3</text><path id="O.B.armR" d="M230,140 C200,125 195,90 215,60" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="247" y="105" class="edge" style="fill:#724994">S6</text><path id="O.B.shoulderR" d="M215,60 L145,35" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="181" y="32" class="edge" style="fill:#9d521e">S1</text></g><g id="O.FL" transform="translate(605 215)"><text x="70" y="-18" class="panelTitle">O.FL / Left front</text><path id="O.FL.outline" d="M125,35 L125,265 L20,265 L0,140 C30,125 35,80 15,45 L85,15 L125,35 Z" fill="#c98e6d" stroke="#333d3d" stroke-width="2"/><path id="O.FL.front" d="M125,35 L125,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="147" y="155" class="edge" style="fill:#ad3f36">F</text><path id="O.FL.hem" d="M125,265 L20,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="72" y="288" class="edge" style="fill:#ad3f36">H</text><path id="O.FL.side" d="M20,265 L0,140" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="-18" y="205" class="edge" style="fill:#596364">S4</text><path id="O.FL.arm" d="M0,140 C30,125 35,80 15,45" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="30" y="100" class="edge" style="fill:#145c92">S7</text><path id="O.FL.shoulder" d="M15,45 L85,15" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="50" y="16" class="edge" style="fill:#9d521e">S2</text><path id="O.FL.neck" d="M85,15 L125,35" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="105" y="7" class="edge" style="fill:#ad3f36">N</text><path d="M80,205 L50,170" fill="none" stroke="#55534d" stroke-width="2" stroke-dasharray="4 4"/><text x="70" y="230" class="small" text-anchor="middle">pocket mark*</text></g><g id="O.SR" transform="translate(805 215)"><text x="110" y="-18" class="panelTitle">O.SR / Right sleeve</text><path id="O.SR.outline" d="M110,15 C165,25 182,75 185,95 L155,285 L65,285 L35,95 C38,75 55,25 110,15 Z" fill="#c98e6d" stroke="#333d3d" stroke-width="2"/><path id="O.SR.capRear" d="M110,15 C165,25 182,75 185,95" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="57" class="edge" style="fill:#724994">S6</text><path id="O.SR.underRear" d="M185,95 L155,285" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="195" class="edge" style="fill:#27704d">S9</text><path id="O.SR.wrist" d="M155,285 L65,285" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="110" y="308" class="edge" style="fill:#ad3f36">W</text><path id="O.SR.underFront" d="M65,285 L35,95" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="195" class="edge" style="fill:#27704d">S9</text><path id="O.SR.capFront" d="M35,95 C38,75 55,25 110,15" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="57" class="edge" style="fill:#145c92">S5</text><circle cx="110" cy="15" r="4" fill="#283333"/><text x="110" y="-1" class="edge">C</text></g><g id="O.SL" transform="translate(1050 215)"><text x="110" y="-18" class="panelTitle">O.SL / Left sleeve</text><path id="O.SL.outline" d="M110,15 C165,25 182,75 185,95 L155,285 L65,285 L35,95 C38,75 55,25 110,15 Z" fill="#c98e6d" stroke="#333d3d" stroke-width="2"/><path id="O.SL.capFront" d="M110,15 C165,25 182,75 185,95" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="57" class="edge" style="fill:#145c92">S7</text><path id="O.SL.underFront" d="M185,95 L155,285" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="195" class="edge" style="fill:#27704d">S10</text><path id="O.SL.wrist" d="M155,285 L65,285" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="110" y="308" class="edge" style="fill:#ad3f36">W</text><path id="O.SL.underRear" d="M65,285 L35,95" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="195" class="edge" style="fill:#27704d">S10</text><path id="O.SL.capRear" d="M35,95 C38,75 55,25 110,15" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="57" class="edge" style="fill:#724994">S8</text><circle cx="110" cy="15" r="4" fill="#283333"/><text x="110" y="-1" class="edge">C</text></g><text x="40" y="555" class="small">C = sleeve-cap split. Blue cap joins front armhole; purple cap joins back armhole. Green sleeve edges join each other.</text><text x="40" y="610" class="section">02 / Matching lining roles — separate assembly</text><text x="40" y="642" class="body">Same chart-edge names; no inward offset, shrink allowance or physical separation established.</text><g id="I.FR" transform="translate(50 685)"><text x="70" y="-18" class="panelTitle">I.FR / Right front</text><path id="I.FR.outline" d="M15,35 L55,15 L125,45 C105,80 110,125 140,140 L120,265 L15,265 L15,35 Z" fill="#edcfb7" stroke="#333d3d" stroke-width="2"/><path id="I.FR.neck" d="M15,35 L55,15" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="35" y="7" class="edge" style="fill:#ad3f36">N</text><path id="I.FR.shoulder" d="M55,15 L125,45" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="90" y="16" class="edge" style="fill:#9d521e">S1</text><path id="I.FR.arm" d="M125,45 C105,80 110,125 140,140" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="110" y="100" class="edge" style="fill:#145c92">S5</text><path id="I.FR.side" d="M140,140 L120,265" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="155" y="205" class="edge" style="fill:#596364">S3</text><path id="I.FR.hem" d="M120,265 L15,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="67" y="288" class="edge" style="fill:#ad3f36">H</text><path id="I.FR.front" d="M15,265 L15,35" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="-7" y="155" class="edge" style="fill:#ad3f36">F</text><path d="M60,205 L90,170" fill="none" stroke="#55534d" stroke-width="2" stroke-dasharray="4 4"/><text x="70" y="230" class="small" text-anchor="middle">bag role*</text></g><g id="I.B" transform="translate(275 685)"><text x="120" y="-18" class="panelTitle">I.B / Full back</text><path id="I.B.outline" d="M145,35 C130,48 110,48 95,35 L25,60 C45,90 40,125 10,140 L35,265 L205,265 L230,140 C200,125 195,90 215,60 L145,35 Z" fill="#edcfb7" stroke="#333d3d" stroke-width="2"/><path id="I.B.neck" d="M145,35 C130,48 110,48 95,35" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="120" y="17" class="edge" style="fill:#ad3f36">N</text><path id="I.B.shoulderL" d="M95,35 L25,60" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="59" y="32" class="edge" style="fill:#9d521e">S2</text><path id="I.B.armL" d="M25,60 C45,90 40,125 10,140" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="-7" y="105" class="edge" style="fill:#724994">S8</text><path id="I.B.sideL" d="M10,140 L35,265" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="-7" y="205" class="edge" style="fill:#596364">S4</text><path id="I.B.hem" d="M35,265 L205,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="120" y="288" class="edge" style="fill:#ad3f36">H</text><path id="I.B.sideR" d="M205,265 L230,140" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="247" y="205" class="edge" style="fill:#596364">S3</text><path id="I.B.armR" d="M230,140 C200,125 195,90 215,60" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="247" y="105" class="edge" style="fill:#724994">S6</text><path id="I.B.shoulderR" d="M215,60 L145,35" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="181" y="32" class="edge" style="fill:#9d521e">S1</text></g><g id="I.FL" transform="translate(605 685)"><text x="70" y="-18" class="panelTitle">I.FL / Left front</text><path id="I.FL.outline" d="M125,35 L125,265 L20,265 L0,140 C30,125 35,80 15,45 L85,15 L125,35 Z" fill="#edcfb7" stroke="#333d3d" stroke-width="2"/><path id="I.FL.front" d="M125,35 L125,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="147" y="155" class="edge" style="fill:#ad3f36">F</text><path id="I.FL.hem" d="M125,265 L20,265" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="72" y="288" class="edge" style="fill:#ad3f36">H</text><path id="I.FL.side" d="M20,265 L0,140" fill="none" stroke="#596364" stroke-width="3" marker-end="url(#direction)"/><text x="-18" y="205" class="edge" style="fill:#596364">S4</text><path id="I.FL.arm" d="M0,140 C30,125 35,80 15,45" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="30" y="100" class="edge" style="fill:#145c92">S7</text><path id="I.FL.shoulder" d="M15,45 L85,15" fill="none" stroke="#9d521e" stroke-width="3" marker-end="url(#direction)"/><text x="50" y="16" class="edge" style="fill:#9d521e">S2</text><path id="I.FL.neck" d="M85,15 L125,35" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="105" y="7" class="edge" style="fill:#ad3f36">N</text><path d="M80,205 L50,170" fill="none" stroke="#55534d" stroke-width="2" stroke-dasharray="4 4"/><text x="70" y="230" class="small" text-anchor="middle">bag role*</text></g><g id="I.SR" transform="translate(805 685)"><text x="110" y="-18" class="panelTitle">I.SR / Right sleeve</text><path id="I.SR.outline" d="M110,15 C165,25 182,75 185,95 L155,285 L65,285 L35,95 C38,75 55,25 110,15 Z" fill="#edcfb7" stroke="#333d3d" stroke-width="2"/><path id="I.SR.capRear" d="M110,15 C165,25 182,75 185,95" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="57" class="edge" style="fill:#724994">S6</text><path id="I.SR.underRear" d="M185,95 L155,285" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="195" class="edge" style="fill:#27704d">S9</text><path id="I.SR.wrist" d="M155,285 L65,285" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="110" y="308" class="edge" style="fill:#ad3f36">W</text><path id="I.SR.underFront" d="M65,285 L35,95" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="195" class="edge" style="fill:#27704d">S9</text><path id="I.SR.capFront" d="M35,95 C38,75 55,25 110,15" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="57" class="edge" style="fill:#145c92">S5</text><circle cx="110" cy="15" r="4" fill="#283333"/><text x="110" y="-1" class="edge">C</text></g><g id="I.SL" transform="translate(1050 685)"><text x="110" y="-18" class="panelTitle">I.SL / Left sleeve</text><path id="I.SL.outline" d="M110,15 C165,25 182,75 185,95 L155,285 L65,285 L35,95 C38,75 55,25 110,15 Z" fill="#edcfb7" stroke="#333d3d" stroke-width="2"/><path id="I.SL.capFront" d="M110,15 C165,25 182,75 185,95" fill="none" stroke="#145c92" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="57" class="edge" style="fill:#145c92">S7</text><path id="I.SL.underFront" d="M185,95 L155,285" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="190" y="195" class="edge" style="fill:#27704d">S10</text><path id="I.SL.wrist" d="M155,285 L65,285" fill="none" stroke="#ad3f36" stroke-width="3" marker-end="url(#direction)"/><text x="110" y="308" class="edge" style="fill:#ad3f36">W</text><path id="I.SL.underRear" d="M65,285 L35,95" fill="none" stroke="#27704d" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="195" class="edge" style="fill:#27704d">S10</text><path id="I.SL.capRear" d="M35,95 C38,75 55,25 110,15" fill="none" stroke="#724994" stroke-width="3" marker-end="url(#direction)"/><text x="27" y="57" class="edge" style="fill:#724994">S8</text><circle cx="110" cy="15" r="4" fill="#283333"/><text x="110" y="-1" class="edge">C</text></g><text x="40" y="1046" class="small">Arrows follow chart perimeter direction. Front halves stay separate. Lining is correspondence only, not a normal-offset shell.</text>
<line x1="40" y1="1075" x2="1320" y2="1075" stroke="#c1b9aa"/>
<text x="40" y="1118" class="section">03 / Join ledger and free openings — apply independently to O and I</text>
<text x="40" y="1160" class="body">S1 / S2   shoulders: fronts ↔ back</text>
<text x="40" y="1192" class="body">S3 / S4   side seams: fronts ↔ back</text>
<text x="40" y="1224" class="body">S5 / S7   front armholes ↔ front cap halves</text>
<text x="40" y="1256" class="body">S6 / S8   back armholes ↔ rear cap halves</text>
<text x="40" y="1288" class="body">S9 / S10  each sleeve’s two underarm edges</text>
<text x="745" y="1160" class="body">N / F / H: one front–neck–hem opening cycle</text>
<text x="745" y="1192" class="body">W: one wrist cycle on each sleeve</text>
<text x="745" y="1224" class="body">Five shell ↔ lining panel correspondences</text>
<text x="745" y="1256" class="body">All free edges remain named for extensions</text>
<text x="745" y="1288" class="body">* Pocket marks do not cut the main-panel graph</text>
<text x="40" y="1350" class="section">04 / Extension interfaces remain future work</text>
<text x="40" y="1390" class="body">Collar → N • hem trim → H • cuffs → W • facings / zip halves → F • guard → left facing</text>
<text x="40" y="1422" class="body">Pocket mouths / bags → paired front-panel interiors. No extension meshes, elastic ratio or closure mechanics.</text>
<rect x="40" y="1460" width="1280" height="85" rx="8" fill="#efe1d4"/>
<text x="60" y="1492" class="body" font-weight="700">Architecture only. 3D placement, physical lining, body contact, coverage, pose and appearance remain unqualified.</text>
<text x="60" y="1522" class="small">Existing global fit refusal: 2189 body / 36 self triangle pairs; 34 coplanar cases unresolved. No old-map rescue.</text>
</svg>
