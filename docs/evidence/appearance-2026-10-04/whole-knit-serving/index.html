<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugata · relaxed knit volume study</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f2efe8;color:#253337;font:16px/1.5 system-ui,sans-serif}
  main{max-width:1280px;padding:24px 36px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}
  h1{font-size:25px;letter-spacing:-.5px;margin:0}small{color:#53676a}.badge{font-size:12px;background:#dce4dd;border-radius:18px;padding:6px 12px;white-space:nowrap}
  nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,a{font:inherit}button{cursor:pointer;background:transparent;color:#253337;border:1px solid #bac8c5;border-radius:7px;padding:7px 17px}
  button[aria-pressed=true]{background:#253f42;color:#fff;border-color:#253f42}button:focus-visible,a:focus-visible{outline:3px solid #be7528;outline-offset:3px}
  button:disabled{cursor:wait;opacity:.5}a{color:#274f66}nav a{margin-left:auto;align-self:center}
  #stage{height:58vh;min-height:320px;max-height:460px;background:#192b32;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:100%}
  footer{display:flex;justify-content:space-between;gap:24px;margin-top:12px;font-size:13px}footer p{margin:0;max-width:760px}output{display:block;color:#53676a;margin-top:4px;font-size:12px}
  @media(max-width:600px){main{padding:18px}h1{font-size:21px}header{align-items:start}footer{display:block}footer div{margin-top:8px}nav a{margin-left:0}#stage{min-height:300px}}
</style>
<main>
  <header><div><small>SUGATA / WARDROBE STUDIES</small><h1>Relaxed knit · volume study</h1></div><span class="badge">Artist draft</span></header>
  <nav aria-label="Volume views"><button disabled data-view="front" aria-pressed="true">Front</button><button disabled data-view="oblique" aria-pressed="false">Shoulder view</button><button disabled data-view="back" aria-pressed="false">Back</button><a href="../knit-shape-sheet/shape-sheet-v1.png">Design sheet ↗</a></nav>
  <div id="stage"><canvas aria-label="Clay sweater volume"></canvas></div>
  <footer><div><p>A shared surface joins torso, shoulders and tapered sleeves. T rest and depth are artist choices. This draft has no body fit, knit material or movement qualification.</p><output id="status" role="status">Loading artist draft…</output></div><div><a download href="mesh.json">Editable JSON</a> · <a download href="sweater.obj">Quad OBJ</a></div></footer>
  <script id="observed-record" type="application/json">{}</script>
</main>

</html>
